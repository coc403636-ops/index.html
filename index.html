<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lua Obfuscator</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d18;color:#e0e0e0;min-height:100vh;padding:16px}
  header{text-align:center;margin-bottom:18px}
  header h1{font-size:26px;background:linear-gradient(90deg,#a855f7,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
  header p{color:#888;font-size:13px;margin-top:4px}
  .container{max-width:1300px;margin:0 auto}
  .opts{display:flex;gap:14px;justify-content:center;margin-bottom:14px;flex-wrap:wrap;font-size:13px;color:#b0b0c0}
  .opts label{display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none}
  .opts input[type=checkbox]{accent-color:#a855f7;cursor:pointer}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:768px){.grid{grid-template-columns:1fr}}
  .panel{background:#16162a;border:1px solid #2d2d44;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .panel-header{padding:9px 12px;background:#12121e;border-bottom:1px solid #2d2d44;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:#9a9aad}
  .panel-header .size{font-weight:400;color:#666;font-size:11px}
  textarea{flex:1;min-height:400px;background:#0a0a14;color:#e0e0e0;border:none;padding:12px;font-family:Consolas,Monaco,monospace;font-size:12.5px;line-height:1.5;resize:vertical;outline:none}
  .controls{margin:14px 0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{padding:10px 18px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
  button:disabled{opacity:.4;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,#a855f7,#3b82f6);color:#fff}
  .btn-primary:hover:not(:disabled){filter:brightness(1.15)}
  .btn-success{background:#16a34a;color:#fff}
  .btn-success:hover:not(:disabled){background:#15803d}
  .btn-secondary{background:#2d2d44;color:#d0d0e0}
  .btn-secondary:hover:not(:disabled){background:#3a3a55}
  .stats{text-align:center;font-size:12.5px;color:#888;margin:6px 0;min-height:20px}
  .stats strong{color:#a855f7}
  .stats .ok{color:#22c55e;font-weight:600}
  .stats .err{color:#ef4444;font-weight:600}
  .warn{background:#3a2a10;border:1px solid #7a5a20;color:#fbbf24;padding:8px 12px;border-radius:8px;font-size:12px;margin-top:10px;display:none}
  footer{text-align:center;margin-top:20px;color:#555;font-size:11px}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🔒 Lua Obfuscator</h1>
    <p>Dán code Lua → Obfuscate → Copy / Download</p>
  </header>

  <div class="opts">
    <label><input type="checkbox" id="optRename" checked> Đổi tên biến local</label>
    <label><input type="checkbox" id="optStrings" checked> Mã hóa string</label>
    <label><input type="checkbox" id="optMinify" checked> Minify</label>
  </div>

  <div class="grid">
    <div class="panel">
      <div class="panel-header"><span>Input (Lua)</span><span class="size" id="inSize">0 ký tự</span></div>
      <textarea id="input" spellcheck="false" placeholder="-- Dán code Lua vào đây...
local greet = &quot;Hello&quot;
local function sayHello(name)
  print(greet .. &quot; &quot; .. name)
end
sayHello(&quot;World&quot;)"></textarea>
    </div>
    <div class="panel">
      <div class="panel-header"><span>Output (Obfuscated)</span><span class="size" id="outSize">0 ký tự</span></div>
      <textarea id="output" readonly spellcheck="false" placeholder="Kết quả xuất hiện ở đây..."></textarea>
    </div>
  </div>

  <div class="controls">
    <button class="btn-primary" onclick="run()">⚡ Obfuscate</button>
    <button class="btn-success" id="copyBtn" onclick="copyOut()" disabled>📋 Copy</button>
    <button class="btn-secondary" id="dlBtn" onclick="download()" disabled>💾 Download .lua</button>
    <button class="btn-secondary" onclick="clearAll()">🗑️ Clear</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="warn" id="warn"></div>

  <footer>Dùng cho mục đích hợp pháp (bảo vệ code của bạn / học tập).</footer>
</div>

<script>
"use strict";

/* ===================== TOKENIZER ===================== */
const KEYWORDS = new Set([
  'and','break','do','else','elseif','end','false','for','function','if','in',
  'local','nil','not','or','repeat','return','then','true','until','while','goto'
]);
const BLACKLIST = new Set(['self','_G','_ENV','arg','...']);

function tokenize(src) {
  const T = [];
  let i = 0, n = src.length;

  while (i < n) {
    const c = src[i];

    // whitespace
    if (/\s/.test(c)) {
      let s = i;
      while (i < n && /\s/.test(src[i])) i++;
      T.push({ type: 'ws', value: src.slice(s, i) });
      continue;
    }

    // comment
    if (c === '-' && src[i+1] === '-') {
      // long comment --[[ ]]
      if (src[i+2] === '[') {
        const eq = matchLongBracket(src, i + 2);
        if (eq !== null) {
          const close = ']' + '='.repeat(eq) + ']';
          const e = src.indexOf(close, i + 2 + eq + 2);
          if (e === -1) { T.push({type:'comment', value: src.slice(i)}); i = n; }
          else { const end = e + close.length; T.push({type:'comment', value: src.slice(i, end)}); i = end; }
          continue;
        }
      }
      let end = src.indexOf('\n', i);
      if (end === -1) end = n;
      T.push({ type: 'comment', value: src.slice(i, end) });
      i = end;
      continue;
    }

    // long string
    if (c === '[') {
      const eq = matchLongBracket(src, i);
      if (eq !== null) {
        const close = ']' + '='.repeat(eq) + ']';
        const s = i + eq + 2;
        const e = src.indexOf(close, s);
        if (e === -1) { T.push({type:'string', value: src.slice(i)}); i = n; }
        else { const end = e + close.length; T.push({type:'string', value: src.slice(i, end)}); i = end; }
        continue;
      }
    }

    // short string
    if (c === '"' || c === "'") {
      const q = c;
      let j = i + 1;
      while (j < n) {
        if (src[j] === '\\') { j += 2; continue; }
        if (src[j] === q) { j++; break; }
        if (src[j] === '\n') break;
        j++;
      }
      T.push({ type: 'string', value: src.slice(i, j) });
      i = j;
      continue;
    }

    // number
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1] || ''))) {
      let j = i;
      if (c === '0' && (src[i+1] === 'x' || src[i+1] === 'X')) {
        j = i + 2;
        while (j < n && /[0-9a-fA-F.]/.test(src[j])) j++;
        if (src[j] === 'p' || src[j] === 'P') { j++; if (src[j]==='+'||src[j]==='-') j++; while (j<n && /[0-9]/.test(src[j])) j++; }
      } else {
        while (j < n && /[0-9.]/.test(src[j])) j++;
        if (src[j] === 'e' || src[j] === 'E') { j++; if (src[j]==='+'||src[j]==='-') j++; while (j<n && /[0-9]/.test(src[j])) j++; }
      }
      T.push({ type: 'number', value: src.slice(i, j) });
      i = j;
      continue;
    }

    // identifier
    if (/[a-zA-Z_]/.test(c)) {
      let j = i;
      while (j < n && /[a-zA-Z0-9_]/.test(src[j])) j++;
      const w = src.slice(i, j);
      T.push({ type: KEYWORDS.has(w) ? 'keyword' : 'ident', value: w });
      i = j;
      continue;
    }

    // multi-char ops (longest first)
    const ops = ['...','..','==','~=','<=','>=','::','//','<<','>>'];
    let matched = false;
    for (const op of ops) {
      if (src.substr(i, op.length) === op) {
        T.push({ type: 'symbol', value: op });
        i += op.length;
        matched = true;
        break;
      }
    }
    if (matched) continue;

    T.push({ type: 'symbol', value: c });
    i++;
  }

  // drop ws + comments for obfuscation pipeline
  return T;
}

function matchLongBracket(s, start) {
  let i = start + 1, eq = 0;
  while (s[i] === '=') { eq++; i++; }
  return s[i] === '[' ? eq : null;
}

/* ===================== STRING ENCODE ===================== */
function parseLuaString(tok) {
  const content = tok.slice(1, -1);
  let out = '', i = 0;
  while (i < content.length) {
    const c = content[i];
    if (c !== '\\') { out += c; i++; continue; }
    const nx = content[i+1];
    switch (nx) {
      case 'n': out += '\n'; i+=2; break;
      case 't': out += '\t'; i+=2; break;
      case 'r': out += '\r'; i+=2; break;
      case 'a': out += '\x07'; i+=2; break;
      case 'b': out += '\b'; i+=2; break;
      case 'f': out += '\f'; i+=2; break;
      case 'v': out += '\v'; i+=2; break;
      case '\\': out += '\\'; i+=2; break;
      case '"': out += '"'; i+=2; break;
      case "'": out += "'"; i+=2; break;
      case '\n': out += '\n'; i+=2; break;
      case '\r': out += '\n'; i+=2; if (content[i]==='\n') i++; break;
      case 'z': i+=2; while (i<content.length && /\s/.test(content[i])) i++; break;
      case 'x': {
        const h = content.substr(i+2, 2);
        const v = parseInt(h, 16);
        if (!isNaN(v)) { out += String.fromCharCode(v); i+=4; }
        else { out += 'x'; i+=2; }
        break;
      }
      default:
        if (/[0-9]/.test(nx)) {
          let num = '', j = i+1;
          while (j<content.length && /[0-9]/.test(content[j]) && num.length<3) { num += content[j]; j++; }
          out += String.fromCharCode(parseInt(num,10) & 0xFF);
          i = j;
        } else { out += nx; i+=2; }
    }
  }
  return out;
}

function encodeStringToken(tok) {
  if (!tok.startsWith('"') && !tok.startsWith("'")) return tok;
  try {
    const s = parseLuaString(tok);
    const bytes = new TextEncoder().encode(s);
    let out = '"';
    for (const b of bytes) out += '\\' + String(b).padStart(3, '0');
    return out + '"';
  } catch (e) {
    return tok;
  }
}

/* ===================== OBFUSCATOR ===================== */
function obfuscate(src, opts) {
  opts = Object.assign({ rename: true, strings: true, minify: true }, opts || {});
  const raw = tokenize(src);

  // dense token stream (skip ws/comments)
  const T = [];
  for (const t of raw) if (t.type !== 'ws' && t.type !== 'comment') T.push(t);

  const rootScope = { parent: null, vars: new Map(), depth: 0 };
  const scopeStack = [rootScope];
  let cur = rootScope;

  const openers = [];
  const tokScope = [];

  let mangleIdx = 0;
  const CHARS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ';
  function mangle() {
    let n = mangleIdx++, s = '';
    do { s = CHARS[n % 52] + s; n = Math.floor(n / 52); } while (n > 0);
    return '__R' + s;
  }

  function declare(scope, name) {
    if (BLACKLIST.has(name)) return;
    if (scope.vars.has(name)) return;
    scope.vars.set(name, opts.rename ? mangle() : name);
  }
  function resolve(scope, name) {
    let s = scope;
    while (s) { if (s.vars.has(name)) return s.vars.get(name); s = s.parent; }
    return null;
  }
  function pushScope(kind) {
    const ns = { parent: cur, vars: new Map(), depth: cur.depth + 1 };
    scopeStack.push(ns); cur = ns; openers.push(kind);
  }
  function popScope() { cur = scopeStack.pop(); }

  /* --- Pass 1: build scopes + declarations --- */
  for (let i = 0; i < T.length; i++) {
    const t = T[i];
    tokScope[i] = cur;

    if (t.type !== 'keyword') continue;
    const kw = t.value;

    if (kw === 'function') {
      pushScope('function');
      // find params paren
      let j = i + 1;
      while (j < T.length && !(T[j].type === 'symbol' && T[j].value === '(')) j++;
      if (j < T.length) {
        j++;
        let depth = 1, expectParam = true;
        while (j < T.length && depth > 0) {
          const tk = T[j];
          if (tk.type === 'symbol') {
            if (tk.value === '(') depth++;
            else if (tk.value === ')') { depth--; if (depth === 0) break; }
            else if (tk.value === ',') expectParam = true;
          } else if (tk.type === 'ident' && expectParam) {
            declare(cur, tk.value);
            expectParam = false;
          } else if (tk.value === '...' && expectParam) {
            expectParam = false;
          }
          j++;
        }
      }
    } else if (kw === 'do') {
      pushScope('do');
    } else if (kw === 'if') {
      pushScope('if');
    } else if (kw === 'then') {
      pushScope('then');
    } else if (kw === 'elseif') {
      if (openers.length) { openers.pop(); popScope(); }
      // next `then` will push
    } else if (kw === 'else') {
      if (openers.length) { openers.pop(); popScope(); }
      pushScope('else');
    } else if (kw === 'for') {
      pushScope('for');
      // declare loop vars
      let j = i + 1;
      while (j < T.length) {
        const tk = T[j];
        if (tk.type === 'keyword' && (tk.value === 'in' || tk.value === 'do')) break;
        if (tk.type === 'symbol' && tk.value === '=') break;
        if (tk.type === 'ident') declare(cur, tk.value);
        j++;
      }
    } else if (kw === 'while') {
      pushScope('while');
    } else if (kw === 'repeat') {
      pushScope('repeat');
    } else if (kw === 'end') {
      while (openers.length && (openers[openers.length-1] === 'then' || openers[openers.length-1] === 'else')) {
        openers.pop(); popScope();
      }
      const opener = openers.pop();
      if (opener) popScope();
      if (opener === 'do' && openers.length) {
        const below = openers[openers.length-1];
        if (below === 'for' || below === 'while') { openers.pop(); popScope(); }
      }
    } else if (kw === 'until') {
      if (openers.length) { openers.pop(); popScope(); }
    } else if (kw === 'local') {
      let j = i + 1;
      if (j < T.length && T[j].type === 'keyword' && T[j].value === 'function') {
        j++;
        if (j < T.length && T[j].type === 'ident') declare(cur, T[j].value);
      } else {
        while (j < T.length) {
          const tk = T[j];
          if (tk.type === 'ident') {
            declare(cur, tk.value);
            j++;
            // skip type annotation `: Type`
            if (j < T.length && T[j].type === 'symbol' && T[j].value === ':') {
              j++;
              let d = 0;
              while (j < T.length) {
                const t2 = T[j];
                if (t2.type === 'symbol') {
                  if (['<','(','{','['].includes(t2.value)) d++;
                  else if (['>',')','}',
                    ']'].includes(t2.value)) d--;
                  else if (d === 0 && (t2.value === ',' || t2.value === '=')) break;
                }
                j++;
              }
            }
            continue;
          }
          if (tk.type === 'symbol' && tk.value === ',') { j++; continue; }
          break;
        }
      }
    }
  }

  /* --- Pass 2: emit --- */
  let out = '';
  let pType = null, pVal = '';

  function needSpace(pt, pv, ct, cv) {
    if (!pt) return false;
    const wordy = new Set(['ident','keyword','number']);
    if (wordy.has(pt) && wordy.has(ct)) return true;
    if (pt === 'string' && wordy.has(ct)) return true;
    if (wordy.has(pt) && ct === 'string') return true;
    if (pt === 'symbol' && pv === '-' && ct === 'symbol' && cv.startsWith('-')) return true;
    if (pt === 'number' && ct === 'symbol' && cv === '..') return true;
    if (pt === 'symbol' && pv === '.' && ct === 'number') return true;
    return false;
  }

  for (let i = 0; i < T.length; i++) {
    const t = T[i];
    let v;
    if (t.type === 'ident') {
      const m = opts.rename ? resolve(tokScope[i], t.value) : null;
      v = m || t.value;
    } else if (t.type === 'string' && opts.strings) {
      v = encodeStringToken(t.value);
    } else {
      v = t.value;
    }
    if (opts.minify) {
      if (needSpace(pType, pVal, t.type, v)) out += ' ';
    } else {
      if (pType && !(t.type === 'symbol' && (t.value === ',' || t.value === ')' || t.value === ']'))) out += ' ';
    }
    out += v;
    pType = t.type;
    pVal = v;
  }

  return out;
}

/* ===================== UI ===================== */
const $in = document.getElementById('input');
const $out = document.getElementById('output');
const $stats = document.getElementById('stats');
const $inSize = document.getElementById('inSize');
const $outSize = document.getElementById('outSize');
const $copy = document.getElementById('copyBtn');
const $dl = document.getElementById('dlBtn');
const $warn = document.getElementById('warn');

$in.addEventListener('input', () => {
  $inSize.textContent = $in.value.length + ' ký tự';
});

function run() {
  const src = $in.value;
  $warn.style.display = 'none';
  if (!src.trim()) {
    $stats.innerHTML = '<span class="err">⚠️ Chưa có code</span>';
    return;
  }
  try {
    const opts = {
      rename: document.getElementById('optRename').checked,
      strings: document.getElementById('optStrings').checked,
      minify: document.getElementById('optMinify').checked
    };
    const t0 = performance.now();
    const res = obfuscate(src, opts);
    const t1 = performance.now();
    $out.value = res;
    $outSize.textContent = res.length + ' ký tự';
    $copy.disabled = false;
    $dl.disabled = false;
    const ratio = Math.round((1 - res.length / src.length) * 100);
    $stats.innerHTML = `<span class="ok">✓</span> ${(t1-t0).toFixed(1)}ms · ` +
      `${src.length} → ${res.length} ký tự ` +
      `(${ratio >= 0 ? 'giảm' : 'tăng'} <strong>${Math.abs(ratio)}%</strong>)`;
    // sanity check — warn if obvious imbalance
    const ends = (res.match(/\bend\b/g)||[]).length;
    const opens = (res.match(/\b(function|if|for|while|do)\b/g)||[]).length;
    if (Math.abs(ends - opens) > 1) {
      $warn.style.display = 'block';
      $warn.textContent = '⚠️ Cảnh báo: số `end` không khớp với số block mở. Code gốc có thể bị lỗi cú pháp.';
    }
  } catch (e) {
    $stats.innerHTML = `<span class="err">❌ ${e.message}</span>`;
  }
}

function copyOut() {
  const t = $out.value;
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => {
    const o = $copy.textContent;
    $copy.textContent = '✅ Đã copy!';
    setTimeout(() => $copy.textContent = o, 1400);
  }).catch(() => { $out.select(); document.execCommand('copy'); });
}

function download() {
  const t = $out.value;
  if (!t) return;
  const blob = new Blob([t], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'obfuscated.lua';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function clearAll() {
  $in.value = ''; $out.value = '';
  $inSize.textContent = '0 ký tự'; $outSize.textContent = '0 ký tự';
  $stats.innerHTML = ''; $warn.style.display = 'none';
  $copy.disabled = true; $dl.disabled = true;
}
</script>
</body>
</html>
